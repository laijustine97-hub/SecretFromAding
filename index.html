<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ading's secret</title>

    <link rel="stylesheet" href="ate.css">
</head>

<body>

    <div class="container">

        <h1><h1>Hi Ma'am 💗</h1> 💗</h1>

        <p class="instruction">
    🐱 Psst... the cats know a little secret. Tap one to find out 💗
</p>

        <div class="heart-area">

            <button class="heart" onclick="showMessage(this)">🐱❤️</button>
            <button class="heart" onclick="showMessage(this)">😺💗</button>
            <button class="heart" onclick="showMessage(this)">🐱💕</button>
            <button class="heart" onclick="showMessage(this)">😽💖</button>
            <button class="heart" onclick="showMessage(this)">🐈💝</button>

        </div>

        <div id="messageBox" class="message-box">
            <p id="message">
    🐱💗 Before you go... let me tell you something.
</p>
        </div>

        <button class="next-btn" onclick="newMessage()">
    🐱 One More Secret? 💗
</button>

    </div>

    <script src="ate.js"></script>

</body>
</html>
